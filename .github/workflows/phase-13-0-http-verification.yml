# TEMPORARY: Linux HTTP integration verification for the Phase 13.0 boundary.
name: Phase 13.0 HTTP verification (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase13-linux-verification
    paths:
      - "backend/**"
      - "tests/test_execution_boundary*.py"
      - "tests/test_api_authorization.py"
      - "tests/test_agent_runtime_api.py"
      - "tests/test_j2_production_routes.py"
      - "requirements.txt"
      - ".github/workflows/phase-13-0-http-verification.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_execution_boundary*.py"
      - "tests/test_api_authorization.py"
      - "tests/test_agent_runtime_api.py"
      - "tests/test_j2_production_routes.py"
      - "requirements.txt"
      - ".github/workflows/phase-13-0-http-verification.yml"

jobs:
  phase-13-0-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated CI paths
        shell: bash
        run: |
          CI_ROOT="$RUNNER_TEMP/mjolniros-ci"

          mkdir -p "$CI_ROOT"

          {
            echo "MJOLNIROS_CONFIG_FILE=$CI_ROOT/config.json"
            echo "MJOLNIROS_LOG_FILE=$CI_ROOT/mjolniros.log"
            echo "MJOLNIROS_DATABASE_PATH=$CI_ROOT/mjolniros.sqlite3"
            echo "MJOLNIROS_CHROMA_PATH=$CI_ROOT/chroma"
            echo "MJOLNIROS_SETTINGS_STORAGE_DIRECTORY=$CI_ROOT/settings"
            echo "MJOLNIROS_PLUGIN_DIRECTORY=$CI_ROOT/plugins"
            echo "MJOLNIROS_PLUGIN_CATALOG_FILE=$CI_ROOT/plugins/catalog.json"
            echo "MJOLNIROS_PLUGIN_STATE_FILE=$CI_ROOT/plugin-state.json"
            echo "MJOLNIROS_BROWSER_SESSION_PATH=$CI_ROOT/browser"
            echo "MJOLNIROS_VISION_UPLOAD_DIRECTORY=$CI_ROOT/documents"
            echo "MJOLNIROS_AUTOMATION_STORAGE_DIRECTORY=$CI_ROOT/automation"
            echo "MJOLNIROS_LEARNING_STORAGE_DIRECTORY=$CI_ROOT/learning"
            echo "MJOLNIROS_PRODUCTIVITY_STORAGE_DIRECTORY=$CI_ROOT/productivity"
            echo "MJOLNIROS_COMMUNICATION_STORAGE_DIRECTORY=$CI_ROOT/communication"
            echo "MJOLNIROS_AUDIT_STORAGE_DIRECTORY=$CI_ROOT/audit"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Phase 13.0 focused and HTTP integration tests
        run: >-
          python -m pytest -vv
          tests/test_execution_boundary.py
          tests/test_execution_boundary_http.py
          tests/test_api_authorization.py
          tests/test_capability_router.py
          tests/test_agent_runtime_api.py
          tests/test_j2_production_routes.py