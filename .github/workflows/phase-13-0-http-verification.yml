# TEMPORARY: Linux HTTP integration verification for the Phase 13.0 boundary.
name: Phase 13.0 HTTP verification (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase13-linux-verification
    paths:
      - "backend/**"
      - "tests/test_execution_boundary*.py"
      - "tests/test_api_authorization.py"
      - "tests/test_agent_runtime_api.py"
      - "tests/test_j2_production_routes.py"
      - "requirements.txt"
      - ".github/workflows/phase-13-0-http-verification.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_execution_boundary*.py"
      - "tests/test_api_authorization.py"
      - "tests/test_agent_runtime_api.py"
      - "tests/test_j2_production_routes.py"
      - "requirements.txt"
      - ".github/workflows/phase-13-0-http-verification.yml"

jobs:
  phase-13-0-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MJOLNIROS_CONFIG_FILE: ${{ runner.temp }}/mjolniros-ci-config.json
      MJOLNIROS_LOG_FILE: ${{ runner.temp }}/mjolniros-ci.log
      MJOLNIROS_DATABASE_PATH: ${{ runner.temp }}/mjolniros-ci.sqlite3
      MJOLNIROS_CHROMA_PATH: ${{ runner.temp }}/mjolniros-ci-chroma
      MJOLNIROS_SETTINGS_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-settings
      MJOLNIROS_PLUGIN_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-plugins
      MJOLNIROS_PLUGIN_CATALOG_FILE: ${{ runner.temp }}/mjolniros-ci-plugins/catalog.json
      MJOLNIROS_PLUGIN_STATE_FILE: ${{ runner.temp }}/mjolniros-ci-plugin-state.json
      MJOLNIROS_BROWSER_SESSION_PATH: ${{ runner.temp }}/mjolniros-ci-browser
      MJOLNIROS_VISION_UPLOAD_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-documents
      MJOLNIROS_AUTOMATION_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-automation
      MJOLNIROS_LEARNING_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-learning
      MJOLNIROS_PRODUCTIVITY_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-productivity
      MJOLNIROS_COMMUNICATION_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-communication
      MJOLNIROS_AUDIT_STORAGE_DIRECTORY: ${{ runner.temp }}/mjolniros-ci-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Phase 13.0 focused and HTTP integration tests
        run: >-
          python -m pytest -vv
          tests/test_execution_boundary.py
          tests/test_execution_boundary_http.py
          tests/test_api_authorization.py
          tests/test_capability_router.py
          tests/test_agent_runtime_api.py
          tests/test_j2_production_routes.py
